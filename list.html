function buildScene(){
  const W=1600,Hh=900,r=rng(11),nz=noiseFn(rng(5));
  const ridgeY=(x,base,amp,freq,seed)=>{const n=nz(x*freq+seed,seed*1.7,5);const rdg=1-Math.abs(n*2-1);return base-(rdg*rdg)*amp-n*amp*.35};
  const ridge=(base,amp,freq,seed,step=6)=>{let d=`M-20 ${Hh}`;for(let x=-20;x<=W+20;x+=step)d+=`L${x} ${ridgeY(x,base,amp,freq,seed).toFixed(1)}`;return d+`L${W+20} ${Hh}Z`};
  const snow=(base,amp,freq,seed)=>{let d="";for(let x=-20;x<=W+20;x+=6){const y=ridgeY(x,base,amp,freq,seed);if(y<base-amp*.62){d+=`M${x-3} ${(y+10).toFixed(1)}L${x} ${y.toFixed(1)}L${x+3} ${(y+10).toFixed(1)}Z`}}return d};
  const pines=(base,minH,maxH,seed,gap=[10,26])=>{const rr=rng(seed);let d="";for(let x=-30;x<W+30;x+=gap[0]+rr()*(gap[1]-gap[0])){const h=minH+rr()*(maxH-minH),w=h*(.38+rr()*.12),by=base+(rr()-.5)*14+nz(x*.004,seed)*30;
    d+=`M${(x-w/2).toFixed(1)} ${by.toFixed(1)}L${(x-w*.16).toFixed(1)} ${(by-h*.3).toFixed(1)}L${(x-w*.36).toFixed(1)} ${(by-h*.3).toFixed(1)}L${(x-w*.1).toFixed(1)} ${(by-h*.6).toFixed(1)}L${(x-w*.25).toFixed(1)} ${(by-h*.6).toFixed(1)}L${x.toFixed(1)} ${(by-h).toFixed(1)}L${(x+w*.25).toFixed(1)} ${(by-h*.6).toFixed(1)}L${(x+w*.1).toFixed(1)} ${(by-h*.6).toFixed(1)}L${(x+w*.36).toFixed(1)} ${(by-h*.3).toFixed(1)}L${(x+w*.16).toFixed(1)} ${(by-h*.3).toFixed(1)}L${(x+w/2).toFixed(1)} ${by.toFixed(1)}Z`}
    return d+`M-30 ${base+10}H${W+30}V${Hh}H-30Z`};
  let stars="";for(let i=0;i<170;i++){const x=r()*W,y=r()*r()*560,s=r()*1.3+.3;stars+=`<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${s.toFixed(2)}" fill="#e9f0ff" opacity="${(.3+r()*.7).toFixed(2)}"${r()<.25?` class="tw" style="animation-delay:${(r()*5).toFixed(1)}s"`:""}/>`}
  // castle on mid ridge
  const cx=1226, cy=Math.max(ridgeY(cx,600,170,.0026,40),470)+8;
  const C=(x,y,w,h)=>`M${cx+x} ${cy}V${cy-h}h${w}V${cy}Z`;
  const crenel=(x,w,h,n)=>{let d="";const s=w/(n*2-1);for(let i=0;i<n;i++)d+=`M${cx+x+i*2*s} ${cy-h}v-7h${s}v7Z`;return d};
  const spire=(x,w,h,ph)=>`M${cx+x} ${cy-h}L${cx+x+w/2} ${cy-h-ph}L${cx+x+w} ${cy-h}Z`;
  const castle=[C(-120,0,240,52),crenel(-120,240,52,14),C(-78,0,28,120),spire(-82,36,120,48),C(48,0,30,138),spire(44,38,138,56),C(-34,0,68,150),crenel(-34,68,150,5),C(-11,0,22,205),spire(-15,30,205,70),C(-150,0,26,82),crenel(-150,26,82,2),C(124,0,26,92),crenel(124,26,92,2)].join("");
  let wins="";[[-68,-96],[-68,-70],[58,-112],[58,-84],[-24,-118],[12,-118],[-5,-170],[-24,-80],[12,-80],[-141,-60],[133,-66],[-95,-30],[90,-30]].forEach(([x,y],i)=>{wins+=`<rect x="${cx+x}" y="${cy+y}" width="5" height="9" rx="2.5" fill="#ffc46b" class="win" style="animation-delay:${(i*.37)%3}s"/>`});
  const flag=`<path d="M${cx} ${cy-275}v-30" stroke="#0a0f1e" stroke-width="2.5"/><path d="M${cx} ${cy-305}q14 -4 26 2q-12 5 -26 2z" fill="#0a0f1e" class="flag"/>`;
  $("#scene").innerHTML=`<defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05081a"/><stop offset=".45" stop-color="#121a3c"/><stop offset=".72" stop-color="#2e2a52"/><stop offset=".86" stop-color="#5a3448"/><stop offset="1" stop-color="#7c4136"/></linearGradient>
    <radialGradient id="moonglow"><stop offset="0" stop-color="#f6efd8" stop-opacity=".55"/><stop offset=".25" stop-color="#cfdcf0" stop-opacity=".18"/><stop offset="1" stop-color="#cfdcf0" stop-opacity="0"/></radialGradient>
    <radialGradient id="horizon" cx=".62" cy="1" r=".7"><stop offset="0" stop-color="#ff8f45" stop-opacity=".45"/><stop offset=".5" stop-color="#ff6a3d" stop-opacity=".12"/><stop offset="1" stop-color="#ff6a3d" stop-opacity="0"/></radialGradient>
    <radialGradient id="keepglow"><stop offset="0" stop-color="#ffb35c" stop-opacity=".5"/><stop offset="1" stop-color="#ffb35c" stop-opacity="0"/></radialGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9c6e0" stop-opacity="0"/><stop offset=".5" stop-color="#b9c6e0" stop-opacity=".14"/><stop offset="1" stop-color="#b9c6e0" stop-opacity="0"/></linearGradient>
    <filter id="glowf"><feGaussianBlur stdDeviation="2.2"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>.tw{animation:tw 3.5s ease-in-out infinite}@keyframes tw{50%{opacity:.1}}.win{animation:flick 3s ease-in-out infinite}@keyframes flick{0%,100%{opacity:1}40%{opacity:.75}55%{opacity:.95}70%{opacity:.6}}.flag{transform-box:fill-box;transform-origin:left center;animation:wave 2.4s ease-in-out infinite}@keyframes wave{50%{transform:skewY(6deg) scaleX(.9)}}</style>
  <rect width="${W}" height="${Hh}" fill="url(#sky)"/>
  <g class="layer" data-d=".04">${stars}</g>
  <g class="layer" data-d=".08"><circle cx="1230" cy="210" r="260" fill="url(#moonglow)"/><circle cx="1230" cy="210" r="62" fill="#f1ead4"/><circle cx="1212" cy="196" r="12" fill="#d9d0b6" opacity=".6"/><circle cx="1248" cy="228" r="8" fill="#d9d0b6" opacity=".5"/><circle cx="1240" cy="190" r="5" fill="#d9d0b6" opacity=".5"/></g>
  <rect width="${W}" height="${Hh}" fill="url(#horizon)"/>
  <g class="layer" data-d=".12"><path d="${ridge(560,330,.0019,3)}" fill="#2a2d52"/><rect y="380" width="${W}" height="220" fill="url(#mist)"/></g>
  <g class="layer" data-d=".2"><path d="${ridge(600,170,.0026,40)}" fill="#171a35"/><circle cx="${cx}" cy="${cy-60}" r="160" fill="url(#keepglow)"/><path d="${castle}" fill="#10132b"/><g filter="url(#glowf)">${wins}</g>${flag}<rect y="470" width="${W}" height="160" fill="url(#mist)"/></g>
  <g class="layer" data-d=".32"><path d="${pines(720,50,120,7,[9,22])}" fill="#0e1127"/><rect y="640" width="${W}" height="120" fill="url(#mist)"/></g>
  <g class="layer" data-d=".5"><path d="${pines(860,120,300,21,[24,70])}" fill="#05070f"/></g>`;
}

function embers(){
  const cv=$("#embers"),ctx=cv.getContext("2d");let W=0,Hh=0,P=[],on=true,dpr=Math.min(2,devicePixelRatio||1);
  const size=()=>{W=cv.clientWidth;Hh=cv.clientHeight;cv.width=W*dpr;cv.height=Hh*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)};
  size();addEventListener("resize",size);
  const mk=(y)=>({x:Math.random()*W,y:y??Hh+10,v:.3+Math.random()*.9,r:.6+Math.random()*2,ph:Math.random()*6.28,a:.4+Math.random()*.6});
  for(let i=0;i<70;i++)P.push(mk(Math.random()*Hh));
  new IntersectionObserver(e=>{on=e[0].isIntersecting;if(on)loop()}).observe(cv);
  function loop(){if(!on)return;ctx.clearRect(0,0,W,Hh);ctx.globalCompositeOperation="lighter";
    for(const p of P){p.y-=p.v;p.ph+=.02;p.x+=Math.sin(p.ph)*.4;const fade=Math.min(1,p.y/(Hh*.9));
      if(p.y<-10){Object.assign(p,mk())}
      const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*4);g.addColorStop(0,`rgba(255,190,110,${p.a*fade})`);g.addColorStop(.4,`rgba(255,120,50,${p.a*.35*fade})`);g.addColorStop(1,"rgba(255,80,30,0)");
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.r*4,0,6.29);ctx.fill()}
    requestAnimationFrame(loop)}
  loop();
}

function frameScene(){const sc=$("#scene"),hero=$("#intro");if(!sc||!hero.clientWidth)return;const ratio=hero.clientWidth/hero.clientHeight;
  if(ratio<1.6){const vw=900*ratio,c=ratio<.9?720:1180,x=Math.max(0,Math.min(1600-vw,c-vw/2));sc.setAttribute("viewBox",`${x.toFixed(0)} 0 ${vw.toFixed(0)} 900`)}else sc.setAttribute("viewBox","0 0 1600 900")}
let sceneBuilt=false;
function showIntro(force){
  const el=$("#intro");if(!force&&LS.get("ww-intro")==="1")return;
  el.hidden=false;el.classList.remove("out");
  if(!sceneBuilt){sceneBuilt=true;buildScene();if(!reduced)embers()}
  frameScene();
  if(!el.querySelector(".skip")){const s=document.createElement("button");s.className="skip";s.textContent="Skip";s.onclick=()=>hideIntro(false);el.appendChild(s)}
  setTimeout(()=>$("#enter").focus({preventScroll:true}),2400);
}
function hideIntro(boom){const el=$("#intro");if(boom)play("boom");LS.set("ww-intro","1");el.classList.add("out");setTimeout(()=>{el.hidden=true},900)}
$("#enter").addEventListener("click",()=>hideIntro(true));
document.addEventListener("keydown",e=>{if(!$("#intro").hidden&&e.key==="Enter"&&!e.target.closest("button")){e.preventDefault();hideIntro(true)}});
